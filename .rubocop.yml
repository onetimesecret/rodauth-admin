# .rubocop.yml
#
# Mirrors the onetimesecret/onetimesecret configuration where it applies:
# every Ruby file carries a path header and the frozen_string_literal pragma.

plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-sequel
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - 'db/migrate/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'data/**/*'

# Tryouts files are bare expressions followed by `#=>` expectations; the
# "void context" and "useless assignment" cops misread them, and autocorrect
# deletes the test bodies.
Lint/Void:
  Exclude:
    - 'try/**/*'
Lint/UselessAssignment:
  Exclude:
    - 'try/**/*'

# A tryout file is a script, not a library: its stub doubles (a db that
# always raises, a db that sleeps) belong beside the tests that use them,
# and the concurrency test's whole subject is a second thread.
Style/OneClassPerFile:
  Exclude:
    - 'try/**/*'
ThreadSafety/NewThread:
  Exclude:
    - 'try/**/*'

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'lib/rodauth_admin/auth.rb'
    - 'Rakefile'
    - 'spec/**/*'

Metrics/AbcSize:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 30

# Env memoizes a handful of immutable strings read once from ENV.
ThreadSafety/ClassInstanceVariable:
  Exclude:
    - 'lib/rodauth_admin/env.rb'

Layout/LineLength:
  Max: 120

RSpec/ExampleLength:
  Max: 20

# The sign-in specs are end-to-end flows; one example per flow, asserted
# at each step.
RSpec/MultipleExpectations:
  Max: 10

# The mutations spec's `before` hook signs the operator in and has one
# thing to hand the examples afterwards (the TOTP secret it
# minted, needed to re-authenticate mid-example); an instance variable is how
# RSpec passes it. Scoped to that one file: nowhere else needs it, and a
# suite-wide exclusion would stop the cop catching the next one.
RSpec/InstanceVariable:
  Exclude:
    - 'spec/mutations_spec.rb'

RSpec/SpecFilePathFormat:
  Enabled: false
