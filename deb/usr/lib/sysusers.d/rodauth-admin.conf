# sysusers.d(5): created by postinst (systemd-sysusers) and at every boot.
# System user with no login; the home is the unit's StateDirectory=, which
# exists only so bundler has a writable HOME.
#Type Name          ID GECOS                  Home                   Shell
u     rodauth-admin -  "Rodauth Admin service" /var/lib/rodauth-admin /usr/sbin/nologin
