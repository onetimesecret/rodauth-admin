# tmpfiles.d(5): created by postinst (systemd-tmpfiles --create) and at
# every boot.
#Type Path                   Mode UID           GID           Age Argument
# HOME for the service and its transient units. The unit also declares
# StateDirectory=, which covers a systemd-managed start; this covers a CLI
# run on a host that has not booted since the install.
d     /var/lib/rodauth-admin 0750 rodauth-admin rodauth-admin -
# Scratch for the prompted migration credential (`rodauth-admin migrate`).
# On the /run tmpfs and root-only: the value must never reach a disk.
d     /run/rodauth-admin     0700 root          root          -
# systemd does not create the encrypted credential store itself
# (systemd-creds(1)); the mode is what makes sealing safe. Shared with any
# other package on the host, so postrm never removes the directory.
d     /etc/credstore.encrypted 0700 root        root          -
